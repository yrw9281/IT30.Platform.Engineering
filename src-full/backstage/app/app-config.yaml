app:
  title: Todo Developer Portal
  baseUrl: http://localhost:7007
  packages: all
  extensions:
    - page:catalog:
        config:
          path: /

organization:
  name: Todo

backend:
  baseUrl: http://localhost:7007
  listen: ":7007"
  cors:
    origin: http://localhost:7007
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection:
      directory: /tmp/backstage-db

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

auth:
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

permission:
  enabled: true

catalog:
  rules:
    - allow: [Component, Group, User]
  locations:
    - type: file
      target: /app/platform/catalog-info.yaml
    - type: file
      target: /app/platform/templates/template.yaml
      rules:
        - allow: [Template]

scaffolder:
  workingDirectory: /tmp

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - url: https://kubernetes.default.svc
          name: it30-cluster
          authProvider: serviceAccount
          skipMetricsLookup: true
