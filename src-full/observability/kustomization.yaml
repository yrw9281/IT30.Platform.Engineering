apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../bootstrap/scheduling
resources:
  - otel-collector-config.yaml
  - otel-collector.yaml
  - prometheus.yaml
  - loki.yaml
  - tempo.yaml
  - grafana.yaml
configMapGenerator:
  - name: grafana-datasources
    namespace: observability
    files:
      - datasources.yaml
  - name: grafana-dashboards
    namespace: observability
    files:
      - todo-service-overview.json
