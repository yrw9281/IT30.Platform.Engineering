apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: grafana
  namespace: observability
spec:
  selector:
    istio: ingress
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - grafana.10.124.2.77.sslip.io
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: grafana
  namespace: observability
spec:
  hosts:
    - grafana.10.124.2.77.sslip.io
  gateways:
    - grafana
  http:
    - route:
        - destination:
            host: grafana.observability.svc.cluster.local
            port:
              number: 3000
