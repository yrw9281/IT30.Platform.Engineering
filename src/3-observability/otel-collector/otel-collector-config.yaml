apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 64
      resource/platform:
        attributes:
          - key: platform.name
            value: todo-platform
            action: upsert
      attributes/remove-sensitive:
        actions:
          - key: enduser.id
            action: delete
          - key: authorization
            action: delete
          - key: http.request.header.authorization
            action: delete
      batch:
        timeout: 5s
        send_batch_size: 1024

    exporters:
      debug:
        verbosity: detailed

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors:
            - memory_limiter
            - resource/platform
            - attributes/remove-sensitive
            - batch
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors:
            - memory_limiter
            - resource/platform
            - attributes/remove-sensitive
            - batch
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors:
            - memory_limiter
            - resource/platform
            - attributes/remove-sensitive
            - batch
          exporters: [debug]
