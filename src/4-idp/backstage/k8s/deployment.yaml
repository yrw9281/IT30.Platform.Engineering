apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          image: ghcr.io/yrw9281/it30-idp-backstage:demo
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7007
          env:
            - name: K8S_API_URL
              valueFrom:
                secretKeyRef:
                  name: backstage-k8s-conn
                  key: apiUrl
            - name: K8S_BACKSTAGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-k8s-conn
                  key: token
            - name: K8S_BACKSTAGE_CA_DATA
              valueFrom:
                secretKeyRef:
                  name: backstage-k8s-conn
                  key: caData
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
spec:
  selector:
    app: backstage
  ports:
    - name: http
      port: 7007
      targetPort: http
