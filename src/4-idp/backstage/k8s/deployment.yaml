apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          image: ghcr.io/yrw9281/it30-idp-backstage:demo
          imagePullPolicy: Always
          command:
            - node
          args:
            - packages/backend
            - --config
            - app-config.yaml
            - --config
            - app-config.production.yaml
            - --config
            - /app/todo-templates/app-config.templates.yaml
          ports:
            - name: http
              containerPort: 7007
          env:
            - name: K8S_API_URL
              valueFrom:
                secretKeyRef:
                  name: backstage-k8s-conn
                  key: apiUrl
            - name: K8S_BACKSTAGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-k8s-conn
                  key: token
            - name: K8S_BACKSTAGE_CA_DATA
              valueFrom:
                secretKeyRef:
                  name: backstage-k8s-conn
                  key: caData
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: todo-templates
              mountPath: /app/todo-templates/app-config.templates.yaml
              subPath: app-config.templates.yaml
              readOnly: true
            - name: todo-templates
              mountPath: /app/todo-templates/preview-template.yaml
              subPath: preview-template.yaml
              readOnly: true
            - name: todo-templates
              mountPath: /app/todo-templates/pr-preview-template.yaml
              subPath: pr-preview-template.yaml
              readOnly: true
            - name: todo-templates
              mountPath: /app/todo-templates/skeleton/microservice.yaml
              subPath: skeleton/microservice.yaml
              readOnly: true
            - name: todo-templates
              mountPath: /app/todo-templates/skeleton/kustomization.yaml
              subPath: skeleton/kustomization.yaml
              readOnly: true
      volumes:
        - name: todo-templates
          configMap:
            name: backstage-todo-templates
            items:
              - key: app-config.templates.yaml
                path: app-config.templates.yaml
              - key: preview-template.yaml
                path: preview-template.yaml
              - key: pr-preview-template.yaml
                path: pr-preview-template.yaml
              - key: microservice.yaml
                path: skeleton/microservice.yaml
              - key: kustomization.yaml
                path: skeleton/kustomization.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
spec:
  selector:
    app: backstage
  ports:
    - name: http
      port: 7007
      targetPort: http
