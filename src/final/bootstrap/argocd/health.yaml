apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  resource.customizations.health.platform.example.io_Microservice: |
    local hs = { status = "Progressing", message = "Waiting for current operator status" }
    local generation = obj.metadata.generation
    if obj.status == nil or obj.status.observedGeneration ~= generation then
      return hs
    end
    local ready = nil
    for _, condition in ipairs(obj.status.conditions or {}) do
      if condition.observedGeneration ~= generation then
        return hs
      end
      if condition.type == "Stalled" and condition.status == "True" then
        hs.status = "Degraded"
        hs.message = condition.message or condition.reason or "Reconciliation stalled"
        return hs
      end
      if condition.type == "Ready" and condition.status == "True" then
        ready = condition
      end
    end
    if ready ~= nil then
      hs.status = "Healthy"
      hs.message = ready.message or "Managed resources are ready"
    end
    return hs
